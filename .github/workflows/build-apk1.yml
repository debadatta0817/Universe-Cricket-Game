name: Build World Cricket Universe APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract game project
        run: unzip -q World_Cricket_Universe_Mobile_Build.zip

      - name: Build APK
        run: gradle --no-daemon -p WorldCricketUniverse :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: world-cricket-universe-debug-apk
          path: WorldCricketUniverse/app/build/outputs/apk/debug/app-debug.apk
          
